[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
selflow-core = { path = "crates/selflow-core" }
selflow-i18n = { path = "crates/selflow-i18n" }
selflow-protocol = { path = "crates/selflow-protocol" }
selflow-platform = { path = "crates/selflow-platform" }
selflow-client = { path = "crates/selflow-client" }
clap = { version = "4.6", features = ["derive"] }
fastrand = "2.5"
fluent-bundle = "0.16"
iced = { version = "0.14", features = ["tokio"] }
iced_exwlshell = "0.21.4"
jiff = { version = "1.0", features = ["serde"] }
notify-rust = "4.19"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27"
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unic-langid = "0.9.6"
