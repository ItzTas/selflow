# Language for messages from Selflow: "en" or "pt-BR".
language = "en"
# When a new day begins, so a late night still counts as the day before.
day_starts_at = "05:00"
# How long a change that loosens the rules waits before it takes effect.
loosening_delay = "24h"

# Named times that a rule can use as its start or end.
[anchors]
# The time you plan to be in bed.
bedtime = "23:00"
# The time you plan to get up.
wake = "07:00"

# A group of rules and unlock challenges for the days listed below.
[[rule_set]]
# The name of this rule set.
name = "every-night"
# The days this rule set covers, from "mon" to "sun".
days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]

# What it takes to unlock the screen during a lock; every rule below starts from these.
[rule_set.challenges]
# How long to wait before the unlock option appears.
wait = "2m"
# Whether to write a reason for unlocking, shown in the next-day report.
reason = true
# A sentence to type before unlocking; an empty value means none.
phrase = ""
# How many extensions each rule allows per day.
extensions = 1
# How long each extension lasts.
extension_length = "20m"

# A rule: at its start, Selflow sends its notices and then takes its action.
[[rule_set.rule]]
# A short name for this rule, unique within its rule set.
id = "bedtime"
# The name shown in notices and on the lock screen.
label = "Bedtime"
# When the rule starts: an anchor name or a time like "23:00".
start = "bedtime"
# The rule starts at a random moment up to this long after start; "0m" keeps it exact.
start_jitter = "15m"
# When the rule ends: an anchor name or a time like "07:00"; length = "8h" works too.
end = "wake"
# How long before the start each notice comes; "0m" sends one right at the start.
notices = ["15m", "5m", "1m"]
# Locks the screen from the start to the end.
lock = true
# Shuts the computer down if the screen stays locked this long; remove the line to never shut down.
shutdown_after = "30m"
# Your own words for the notices; with a list, Selflow picks one each day.
# message = ["Time to wind down.", "The day is done. Rest well."]
# Instead of lock and shutdown_after, a rule can shut the computer down at its start; "repeat" does it again on every boot until the rule ends.
# shutdown = "once"

# Challenges for this rule alone, on top of the ones from its rule set.
# [rule_set.rule.challenges]
# extensions = 0

# A reminder: a rule with only a start and a message sends one notice when it starts.
# [[rule_set.rule]]
# id = "stretch"
# start = "21:00"
# message = "A good moment to stretch and drink some water."

# A day off: on this date, the listed rules don't run, or every rule when rules is left out.
# Adding one waits like any change that loosens the rules, so add it at least a day ahead.
# [[exception]]
# date = "2026-12-25"
# rules = ["bedtime"]
